project:
  name: house_prices
  seed: 42
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  reports: reports
  experiments: reports/experiments
  figures: reports/figures
  submission: SUBMIT-summarize_report
data:
  train_file: train.csv
  test_file: test.csv
  target: SalePrice
  id_col: Id
  log_target: true
split:
  test_size: 0.2
  n_folds: 5
clean:
  outlier_rules:
  - col: GrLivArea
    gt: 4000
    target_lt: 300000
preprocess:
  scaler: robust
  skew_threshold: 0.75
  skew_min_unique: 15
features:
  drop:
  - Street
  - PoolArea
  - MiscVal
models:
  lasso:
    alpha: 0.0005
    max_iter: 50000
  lightgbm:
    n_estimators: 3000
    learning_rate: 0.01
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 200
  elasticnet:
    alpha: 0.0005
    l1_ratio: 0.5
    max_iter: 50000
  kernelridge:
    alpha: 0.5
    kernel: polynomial
    degree: 2
    coef0: 2.5
  randomforest:
    n_estimators: 300
    min_samples_leaf: 2
    max_features: sqrt
  xgboost:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 3
    subsample: 0.8
    colsample_bytree: 0.6
    early_stopping_rounds: 200
  catboost:
    iterations: 2000
    learning_rate: 0.03
    depth: 4
    early_stopping_rounds: 200
ensemble:
  method: blending
  meta_alpha: 1.0
metrics:
- rmse
- mae
- r2
- rmsle
run:
  models:
  - lasso
  - elasticnet
  - kernelridge
  - randomforest
  - lightgbm
